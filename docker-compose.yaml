services:
  postgres:
    image: postgres:17
    container_name: careertrack-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - careertrack_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  careertrack_data:
